<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delcom Lost &amp; Founds</title>
    <meta
      name="description"
      content="Delcom Lost & Founds - platform terpadu untuk melaporkan barang hilang dan barang temuan, serta membantu mengembalikannya kepada pemiliknya."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font dimuat secara asinkron agar tidak memblokir render pertama -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <style>
      body { margin: 0; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
      .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
      .spinner { width: 2.5rem; height: 2.5rem; border: 4px solid rgba(37, 99, 235, 0.3); border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <main class="page-loader">
        <h1 class="sr-only">Memuat halaman...</h1>
        <div role="status" aria-live="polite">
          <div class="spinner"></div>
          <span class="sr-only">Memuat...</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
