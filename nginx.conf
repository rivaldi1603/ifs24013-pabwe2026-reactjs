server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Text compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml font/ttf;

  # Hashed assets: cache for 1 year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # index.html must always be revalidated
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
